name: Nenek Trivia
description: Pon a prueba lo que sabes de la Huasteca Potosina con preguntas sobre su historia, cultura y tradiciones.
full_description: '<p>Descubre la Huasteca Potosina mientras juegas. Responde preguntas sobre sus municipios, historia, geografía, tradiciones y gastronomía antes de que termine el tiempo. Consulta consejos, suma puntos y compara tu puntuación en el cuadro de honor.</p>'
android: https://play.google.com/store/apps/details?id=com.fenixarts.nenektrivia
