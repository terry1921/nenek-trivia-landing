name: Deploy Firebase Hosting and publish release on master merge
'on':
  push:
    branches:
      - master
concurrency:
  group: firebase-hosting-master-production
  cancel-in-progress: false
jobs:
  build_and_deploy:
    name: Build and deploy to Firebase Hosting live
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Install Node dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Use supported Node.js for Firebase CLI
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy to Firebase Hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NENEK_TRIVIA }}'
          channelId: live
          projectId: nenek-trivia
          firebaseToolsVersion: 15.36.0
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

  create_release:
    name: Tag deployed version and create GitHub Release
    needs: build_and_deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out deployed commit and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create version tag and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          latest_tag="$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

          if [[ -n "$latest_tag" ]]; then
            if git merge-base --is-ancestor "$GITHUB_SHA" "$latest_tag"; then
              latest_tag_commit="$(git rev-list -n 1 "$latest_tag")"
              if [[ "$latest_tag_commit" == "$GITHUB_SHA" ]] && ! gh release view "$latest_tag" >/dev/null 2>&1; then
                echo "Tag $latest_tag exists but its GitHub Release is missing; completing the release."
                recovery_notes="$RUNNER_TEMP/release-notes.md"
                git for-each-ref --format='%(contents)' "refs/tags/$latest_tag" > "$recovery_notes"
                gh release create "$latest_tag" \
                  --verify-tag \
                  --target "$GITHUB_SHA" \
                  --title "Nenek Trivia Landing $latest_tag" \
                  --notes-file "$recovery_notes"
                exit 0
              fi

              echo "Commit $GITHUB_SHA is already included in release $latest_tag; skipping duplicate release."
              exit 0
            fi

            IFS='.' read -r major minor patch <<< "$latest_tag"
            version="$major.$minor.$((10#$patch + 1))"
            previous_tag="$latest_tag"
          else
            version="$(node -p "require('./package.json').version")"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "package.json version must be in MAJOR.MINOR.PATCH format; found: $version" >&2
              exit 1
            fi
            previous_tag=""
          fi

          tag_name="$version"
          notes_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$tag_name"
            -f "target_commitish=$GITHUB_SHA"
          )
          if [[ -n "$previous_tag" ]]; then
            notes_args+=(-f "previous_tag_name=$previous_tag")
          fi

          notes_json="$RUNNER_TEMP/release-notes.json"
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api "${notes_args[@]}" > "$notes_json"

          generated_title="$(jq -r '.name // empty' "$notes_json")"
          generated_notes="$(jq -r '.body // empty' "$notes_json")"
          if [[ -z "$generated_notes" ]]; then
            echo "GitHub did not generate release notes; refusing to create an empty release." >&2
            exit 1
          fi

          {
            printf 'Versión %s\n\n' "$tag_name"
            if [[ -n "$previous_tag" ]]; then
              printf 'Cambios desde `%s`.\n\n' "$previous_tag"
            else
              printf 'Primera release versionada del repositorio.\n\n'
            fi
            printf 'Commit desplegado en Firebase Hosting live: `%s`.\n\n' "$GITHUB_SHA"
            printf '%s\n' "$generated_notes"
          } > "$notes_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag_name" --file "$notes_file" "$GITHUB_SHA"
          git push origin "refs/tags/$tag_name"

          release_title="Nenek Trivia Landing $tag_name"
          if [[ -n "$generated_title" ]]; then
            release_title="$generated_title"
          fi
          gh release create "$tag_name" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes-file "$notes_file"
