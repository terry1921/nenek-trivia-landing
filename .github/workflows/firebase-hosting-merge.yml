# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    name: Build and deploy to Firebase Hosting live
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Install Node dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Use supported Node.js for Firebase CLI
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy to Firebase Hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NENEK_TRIVIA }}'
          channelId: live
          projectId: nenek-trivia
          firebaseToolsVersion: 15.36.0
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
